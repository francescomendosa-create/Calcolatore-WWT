<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Process Managed</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="application-name" content="Process Managed" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Process Managed" />
  <link rel="manifest" href="manifest.json?v=wwt5" />
  <link rel="apple-touch-icon" href="wwt-icon-192.png?v=wwt5" />
  <link rel="icon" type="image/png" href="wwt-icon-192.png?v=wwt5" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
      color: #e8eef5;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #app-frame {
      border: 0;
      width: 100%;
      height: 100dvh;
      display: none;
      background: #0b1220;
    }
    #landing {
      max-width: 440px;
      margin: 0 auto;
      padding: 28px 20px 32px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; font-weight: 750; }
    .lead {
      font-size: 0.9rem;
      color: #8fa3bb;
      margin: 0 0 20px;
      line-height: 1.45;
    }
    .url-box {
      font-size: 0.78rem;
      word-break: break-all;
      background: #152033;
      border: 1px solid #2d3f5a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      color: #7dd3fc;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #14532d, #166534);
      color: #bbf7d0;
      border: 1px solid #4ade80;
    }
    .btn-secondary {
      background: #1c2a40;
      color: #e8eef5;
      border: 1px solid #334155;
    }
    .hint {
      font-size: 0.8rem;
      color: #8fa3bb;
      line-height: 1.45;
      margin-top: 16px;
    }
    .hint strong { color: #cbd5e1; }
    #install-btn { display: none; }
  </style>
</head>
<body>
  <iframe id="app-frame" title="Process Managed" src="calcolatore-portate.html" allow="fullscreen"></iframe>

  <div id="landing">
    <h1>Process Managed</h1>
    <p class="lead">Simulatore portate — app separata da ServiceHub. Stesso strumento su PC, tablet e telefono.</p>
    <p class="url-box" id="public-url">—</p>
    <button type="button" class="btn btn-primary" id="open-btn">Apri simulatore</button>
    <button type="button" class="btn btn-secondary" id="install-btn">Installa app</button>
    <p class="hint">
      <strong>Android / Chrome:</strong> menu ⋮ → <strong>Installa app</strong> o <strong>Aggiungi a schermata Home</strong>.<br />
      <strong>iPhone / iPad:</strong> Safari → condivisione → <strong>Aggiungi a Home</strong>.
    </p>
  </div>

  <script>
    (function () {
      var APP_SRC = "calcolatore-portate.html?v=wwt5";
      var frame = document.getElementById("app-frame");
      var landing = document.getElementById("landing");
      var urlEl = document.getElementById("public-url");
      var installBtn = document.getElementById("install-btn");
      var deferredPrompt = null;

      if (urlEl) urlEl.textContent = location.href.split("?")[0].split("#")[0];

      function showApp() {
        if (frame) {
          frame.style.display = "block";
          frame.src = APP_SRC + "&t=" + Date.now();
        }
        if (landing) landing.style.display = "none";
      }

      var standalone = window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true
        || /[?&]standalone=1/.test(location.search);
      if (standalone) showApp();

      document.getElementById("open-btn").addEventListener("click", showApp);

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=wwt5", { scope: "./" }).then(function (reg) {
          try { reg.update(); } catch (_) {}
          if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
        }).catch(function () {});
      }

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = "block";
      });

      if (installBtn) {
        installBtn.addEventListener("click", async function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = "none";
            return;
          }
          showApp();
        });
      }
    })();
  </script>
</body>
</html>
